<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root { --orange:#FF8A3D; --orange-d:#e0632a; --cream:#FFF8F0; --ink:#333; --muted:#8a6f55; --line:#ead9c2; --green:#4CAF6D; }
  body { font-family:-apple-system,"PingFang HK","Microsoft JhengHei",sans-serif; background:var(--cream); color:var(--ink); }
  #app { max-width:480px; margin:0 auto; min-height:100vh; min-height:100dvh; position:relative; background:var(--cream); box-shadow:0 0 40px rgba(0,0,0,.08); }
  .screen { display:none; flex-direction:column; padding-bottom:92px; min-height:100vh; min-height:100dvh; }
  .screen.active { display:flex; }
  .appbar { padding:18px 20px 14px; background:linear-gradient(135deg,#FF8A3D,#FF6B35); color:#fff; border-radius:0 0 22px 22px; position:sticky; top:0; z-index:5; }
  .appbar h1 { font-size:24px; }
  .appbar h1 .ver { font-size:11px; opacity:.75; font-weight:400; margin-left:6px; }
  .appbar p { font-size:13px; opacity:.92; margin-top:2px; }
  .body-pad { padding:16px; display:flex; flex-direction:column; gap:14px; }
  .sec-title { font-size:14px; font-weight:700; color:var(--muted); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:2px solid var(--line); background:#fff; border-radius:999px; padding:9px 15px; font-size:14px; cursor:pointer; color:#6b543c; }
  .chip.on { background:var(--orange); border-color:var(--orange); color:#fff; font-weight:700; }
  .chip.crave { border-style:dashed; }
  .cta { border:none; border-radius:20px; padding:20px; font-size:22px; font-weight:800; background:linear-gradient(135deg,#FF8A3D,#FF6B35); color:#fff; cursor:pointer; box-shadow:0 8px 20px rgba(255,107,53,.4); }
  .cta:active { transform:scale(.97); }
  .ghost-btn { border:2px solid var(--line); background:#fff; border-radius:16px; padding:14px; font-size:16px; cursor:pointer; color:#6b543c; font-weight:600; }
  .divider { display:flex; align-items:center; gap:10px; color:#b89b78; font-size:13px; }
  .divider::before, .divider::after { content:""; flex:1; height:1px; background:var(--line); }
  .hint { text-align:center; color:#a08a6d; font-size:12px; }
  .today-banner { background:#eef9ef; border:2px solid var(--green); color:#2f7a35; border-radius:14px; padding:10px 14px; font-size:14px; font-weight:600; text-align:center; }
  /* dish card */
  .dish { background:#fff; border-radius:18px; overflow:hidden; box-shadow:0 4px 14px rgba(0,0,0,.07); border:2px solid transparent; }
  .dish.picked { border-color:var(--green); }
  .dish-imgwrap { position:relative; width:100%; aspect-ratio:4/3; background:#f6efe3; }
  .dish-imgwrap img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; opacity:0; transition:opacity .45s; }
  .dish-imgwrap img.loaded { opacity:1; }
  .dish-emoji-fallback { display:flex; width:100%; height:100%; align-items:center; justify-content:center; font-size:64px; background:#f6efe3; }
  .img-note { position:absolute; right:8px; bottom:6px; font-size:10px; color:#fff; background:rgba(0,0,0,.45); padding:2px 8px; border-radius:999px; }
  .photo-btn { position:absolute; left:8px; bottom:6px; font-size:11px; color:#fff; background:rgba(0,0,0,.45); border:none; padding:4px 10px; border-radius:999px; cursor:pointer; }
  .dish-body { padding:14px 16px 16px; display:flex; flex-direction:column; gap:8px; }
  .dish-top { display:flex; justify-content:space-between; align-items:center; }
  .brand { font-weight:800; font-size:13px; color:#fff; padding:5px 12px; border-radius:999px; }
  .brand-logo { display:inline-flex; align-items:center; background:#fff; border-radius:10px; padding:3px 10px; }
  .brand-logo img { height:24px; max-width:120px; object-fit:contain; }
  .bs-logo { display:inline-flex; align-items:center; background:#fff; border-radius:8px; padding:2px 8px; vertical-align:middle; }
  .bs-logo img { height:20px; max-width:100px; object-fit:contain; }
  .floor { font-size:12px; background:#f1e7da; color:var(--muted); padding:4px 10px; border-radius:999px; }
  .dish-name { font-size:19px; font-weight:700; }
  .price { color:var(--orange-d); font-weight:700; font-size:15px; }
  .reason { font-size:14px; color:#5c554b; background:#f6fbf4; border-left:4px solid var(--green); padding:8px 10px; border-radius:0 10px 10px 0; }
  .tip { font-size:13px; color:var(--muted); }
  .dish-actions { display:flex; gap:8px; }
  .dish-actions button { flex:1; border-radius:12px; padding:11px; font-size:15px; cursor:pointer; font-weight:700; }
  .btn-pick { border:none; background:var(--green); color:#fff; }
  .btn-like { border:2px solid var(--line); background:#fff; }
  .btn-like.liked { border-color:var(--green); background:#eef9ef; }
  .btn-dislike { border:2px solid var(--line); background:#fff; }
  .btn-dislike.disliked { border-color:#e05252; background:#fdeeee; }
  .reroll { border:2px dashed var(--orange); background:#fff7f0; color:var(--orange-d); border-radius:16px; padding:14px; font-size:16px; font-weight:700; cursor:pointer; }
  /* log */
  .streak { background:linear-gradient(135deg,#4CAF6D,#2f9e44); color:#fff; border-radius:18px; padding:16px; text-align:center; }
  .streak .big { font-size:34px; font-weight:800; }
  .log-item { background:#fff; border-radius:14px; padding:12px 14px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 2px 8px rgba(0,0,0,.05); gap:8px; }
  .log-item .d { font-size:12px; color:#999; }
  .log-item .n { font-weight:700; font-size:15px; }
  .log-like { display:flex; gap:6px; }
  .log-like button { border:2px solid var(--line); background:#fff; border-radius:10px; padding:6px 10px; font-size:14px; cursor:pointer; }
  .log-like button.on-like { border-color:var(--green); background:#eef9ef; }
  .log-like button.on-dislike { border-color:#e05252; background:#fdeeee; }
  .rate-q { font-size:11px; color:#a08a6d; align-self:center; }
  /* tabbar */
  .tabbar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:#fff; border-top:1px solid #f0e6d6; display:flex; padding:8px 0 calc(10px + env(safe-area-inset-bottom)); z-index:10; }
  .tabbar button { flex:1; border:none; background:none; font-size:12px; color:#a08a6d; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px; }
  .tabbar button .e { font-size:22px; }
  .tabbar button.on { color:var(--orange-d); font-weight:700; }
  /* slot machine overlay */
  #slot-overlay { position:fixed; inset:0; z-index:50; background:rgba(43,33,24,.96); display:none; flex-direction:column; align-items:center; justify-content:center; gap:22px; padding:20px; }
  #slot-overlay.show { display:flex; }
  #slot-overlay h2 { color:#fff; font-size:26px; }
  #slot-overlay .sub { color:#ffd9b8; font-size:14px; }
  .reels { display:flex; gap:14px; }
  .reel { width:96px; height:120px; background:#fff; border-radius:18px; display:flex; align-items:center; justify-content:center; font-size:56px; box-shadow:0 6px 0 #d97a2e; transition:transform .15s; }
  .reel.stopped { animation:pop .3s; box-shadow:0 6px 0 #4CAF6D; }
  @keyframes pop { 0%{transform:scale(1);} 50%{transform:scale(1.18);} 100%{transform:scale(1);} }
  .confetti { position:absolute; width:10px; height:14px; top:-20px; animation:fall linear forwards; border-radius:2px; }
  @keyframes fall { to { transform:translateY(105vh) rotate(720deg); } }
  .browse-sec { font-size:14px; font-weight:800; color:var(--muted); margin-top:4px; }
  .browse-row { background:#fff; border-radius:14px; padding:10px 12px; display:flex; align-items:center; gap:10px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
  .browse-row .be { font-size:30px; }
  .browse-row .bi { flex:1; min-width:0; }
  .browse-row .bn { font-weight:700; font-size:14px; }
  .browse-row .bs { font-size:11px; color:#fff; padding:2px 8px; border-radius:999px; }
  .browse-row .bp { font-size:12px; color:var(--orange-d); font-weight:700; }
  .mini-pick { border:none; background:var(--green); color:#fff; border-radius:10px; padding:8px 12px; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .mini-pick.done { background:#ccc; }
  input[type=file] { display:none; }
</style>
</head>

<div id="app">
  <!-- ===== 主頁 ===== -->
  <div class="screen active" id="s-home">
    <div class="appbar"><h1>🍱 今日食咩？<span class="ver">v1.0</span></h1><p id="greeting">唔使諗，㩒個掣就有人幫你揀</p></div>
    <div class="body-pad">

      </div>

      </div>
      <div class="hint">前一晚／返學前揀定，lunch 就唔使煩<br>📍 樂富廣場 · 價錢係大約數，以現場為準</div>

  </div>

/* ================= 音效（WebAudio，無需外部檔） ================= */
let _actx = null;
function blip(freq, dur){
  try{
    _actx = _actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = _actx.createOscillator(), g = _actx.createGain();
    o.connect(g); g.connect(_actx.destination);
    o.frequency.value = freq; o.type = 'sine';
    g.gain.setValueAtTime(0.09, _actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, _actx.currentTime + dur);
    o.start(); o.stop(_actx.currentTime + dur + 0.02);
  }catch(e){}
}

/* ================= 拉霸機開獎動畫 ================= */
const SLOT_EMOJIS = ["🍚","🍜","🥤","🍱","🍛","🍣","🥟","🍝","🍲","🍤","🍗","🥩"];
function isoDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
/* 30日內 👎 過嘅唔推；唔夠3個揀嗰陣自動唔踢，唔會㩒到無晒 */
function dislikedIds(){
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-30);
  const cut = isoDate(cutoff), bad = new Set();
  getLog().forEach(e=>{ if(e.like===-1 && e.d >= cut) bad.add(e.dish); });
  return bad;
}
function pool(){
  let p;
  if(state.crave) p = SWAPS[state.crave].picks.map(id=>DISH_BY_ID[id]);
  else {
    p = state.type ? DISHES.filter(d=>d.type===state.type) : DISHES.filter(d=>d.type!=="飲品");
    if(state.cheap) p = p.filter(d=>d.cheap);
    if(state.fast) p = p.filter(d=>d.fast);
    if(!p.length) p = DISHES.filter(d=>d.type!=="飲品");
  }
  const bad = dislikedIds();
  const filtered = p.filter(d=>!bad.has(d.id));
  return filtered.length >= 3 ? filtered : p;
}
function openPick(crave){
  state.crave = crave;
  /* iOS：AudioContext 要喺 click gesture 入面開，唔係之後會無聲 */
  try{ _actx=_actx||new (window.AudioContext||window.webkitAudioContext)(); if(_actx.state==='suspended') _actx.resume(); }catch(e){}
  let picks = [...pool()].sort(()=>Math.random()-.5).slice(0,3);
  if(picks.length<3){ /* 保底：唔夠3個就補，唔會開天窗 */
    const filler = DISHES.filter(d=>!picks.includes(d)).sort(()=>Math.random()-.5);
    picks = picks.concat(filler.slice(0, 3-picks.length));
  }
  state.picks = picks;
  runSlot(picks, ()=>{
    renderDishes(picks);
    go('s-pick');
  });
}
function runSlot(picks, done){
  const ov = document.getElementById('slot-overlay');
  document.getElementById('slot-sub').textContent = state.crave
    ? "心思思「" + SWAPS[state.crave].label + "」？睇下有咩替代…"
    : "睇下今日食咩好…";
  ov.classList.add('show');
  const reels = [0,1,2].map(i=>document.getElementById('reel'+i));
  reels.forEach(r=>r.classList.remove('stopped'));
  const timers = reels.map((r,i)=>{
    r.textContent = SLOT_EMOJIS[i*4 % SLOT_EMOJIS.length];
    return setInterval(()=>{ r.textContent = SLOT_EMOJIS[Math.floor(Math.random()*SLOT_EMOJIS.length)]; }, 75);
  });
  const stopAt = [700, 1200, 1700];
  picks.forEach((d,i)=>{
    setTimeout(()=>{
      clearInterval(timers[i]);
      const dd = picks[i % picks.length];
      reels[i].textContent = dd.emoji;
      reels[i].classList.add('stopped');
      blip(i===2 ? 880 : 620, 0.14);
    }, stopAt[i]);
  });
  setTimeout(()=>{
    confetti(ov);
    blip(1040, 0.25);
  }, 1750);
  setTimeout(()=>{ ov.classList.remove('show'); ov.querySelectorAll('.confetti').forEach(c=>c.remove()); done(); }, 2150);
}
function confetti(container){
  const colors = ["#FF8A3D","#4CAF6D","#FFD93D","#6BCBFF","#FF6B9D","#fff"];
  for(let i=0;i<28;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random()*100 + '%';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = (1.4 + Math.random()*1.2) + 's';
    c.style.animationDelay = (Math.random()*0.4) + 's';
    container.appendChild(c);
  }
}

function brand(shopId){

}
function brandSm(shopId){

}
function dishCard(d){

    '<div class="dish-imgwrap">' +

    '</div>' +
    '<div class="dish-body">' +
      '<div class="dish-top">'+brand(d.shop)+'<span class="floor">'+s.floor+'</span></div>' +
      '<div class="dish-name">'+d.name+' <span class="price">'+d.price+'</span></div>' +

        '<button class="btn-pick" onclick="pickDish(\''+d.id+'\',this)">就係佢！</button>' +
      '</div>' +
    '</div></div>';
}
function renderDishes(picks){

/* ================= 打卡記錄 ================= */
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function getLog(){ try{ return JSON.parse(localStorage.getItem('lunch_log_v1')||'[]'); }catch(e){ return []; } }
function saveLog(l){ try{ localStorage.setItem('lunch_log_v1', JSON.stringify(l.slice(-60))); }catch(e){} }
function logMeal(dishId, like){
  const t = todayStr(), log = getLog();
  /* 揀得返即係個 👎 過咗期，清咗佢，唔好自己阻住自己 */
  if(like===0) log.forEach(e=>{ if(e.dish===dishId && e.like===-1) e.like=0; });
  const ex = log.find(e=>e.d===t && e.dish===dishId);
  if(ex){ ex.like = like; } else { log.push({d:t, dish:dishId, like:like}); }
  saveLog(log);
}
/* 打卡（揀咗）同評分（好唔好食）係兩個 concept：評分只喺記錄度做，食完先評 */
function setLike(dateStr, dishId, v){
  const log = getLog();
  const ex = log.find(e=>e.d===dateStr && e.dish===dishId);
  if(ex){ ex.like = (ex.like===v ? 0 : v); saveLog(log); }
  renderLog();
}
function streak(){
  const days = new Set(getLog().map(e=>e.d));
  let n = 0, d = new Date();
  if(!days.has(todayStr())) d.setDate(d.getDate()-1);
  while(true){
    const k = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(days.has(k)){ n++; d.setDate(d.getDate()-1); } else break;
  }
  return n;
}
function weekdayStr(ds){ return ["日","一","二","三","四","五","六"][new Date(ds+'T12:00:00').getDay()]; }
function renderTodayBanner(){
  const b = document.getElementById('today-banner');
  const t = getLog().filter(e=>e.d===todayStr());
  if(t.length){
    const d = DISH_BY_ID[t[t.length-1].dish];
    b.style.display = 'block';
    b.textContent = '✓ 今日揀咗：' + SHOPS[d.shop].name + ' ' + d.name;
  } else b.style.display = 'none';
}
function renderLog(){
  const body = document.getElementById('log-body');
  const log = getLog().slice().reverse().slice(0,14);
  const st = streak();
  let html = '<div class="streak"><div class="big">🔥 '+st+' 日</div><div>連續有揀 lunch！keep 住！</div></div>';
  if(!log.length) html += '<div class="hint">未有記錄，聽日開始打卡啦</div>';
  html += log.map(e=>{
    const d = DISH_BY_ID[e.dish]; if(!d) return '';
    const s = SHOPS[d.shop];
    const q = e.like===0 ? '<span class="rate-q">好唔好食？</span>' : '';
    return '<div class="log-item"><div><div class="n">'+s.name+' · '+d.name+'</div><div class="d">'+e.d.slice(5).replace('-','/')+'（'+weekdayStr(e.d)+'）</div></div>' +
      '<div class="log-like">'+q+'<button class="'+(e.like===1?'on-like':'')+'" onclick="setLike(\''+e.d+'\',\''+e.dish+'\',1)">👍</button>' +
      '<button class="'+(e.like===-1?'on-dislike':'')+'" onclick="setLike(\''+e.d+'\',\''+e.dish+'\',-1)">👎</button></div></div>';
  }).join('');
  html += '<div class="hint">👎 嘅嘢 30 日內唔會再推俾你，隨時㩒返轉頭改得返</div>';
  body.innerHTML = html;
}

/* ================= 📷 換相 ================= */
let photoTarget = null;
function changePhoto(dishId){
  photoTarget = dishId;
  document.getElementById('photo-input').click();
}
document.getElementById('photo-input').addEventListener('change', function(){
  const f = this.files[0]; if(!f || !photoTarget) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const max = 800, sc = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width*sc); cv.height = Math.round(img.height*sc);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      const url = cv.toDataURL('image/jpeg', 0.82);
      try{
        const all = JSON.parse(localStorage.getItem('lunch_photos_v1')||'{}');
        all[photoTarget] = url;
        localStorage.setItem('lunch_photos_v1', JSON.stringify(all));
        const wrap = document.querySelector('#dish-'+photoTarget+' .dish-imgwrap');
        if(wrap){ const im = wrap.querySelector('img'); if(im){ im.src = url; im.classList.add('loaded'); } }
      }catch(e){ alert('張相太大，存唔到，試下影細張啲'); }
      photoTarget = null;
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
  this.value = '';
});
